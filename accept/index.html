<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The link carries the quote's token: never pass it on to another site. -->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://oqrfipoixhujihgakiji.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Your quote</title>
<style>
  :root {
    --ground: #f5f6f3;
    --card: #ffffff;
    --ink: #17221b;
    --muted: #5f6b64;
    --line: #dfe4df;
    --accent: #2f6b46;
    --accent-ink: #ffffff;
    --warn: #8a4b14;
    --warn-tint: #fbf1e6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111613;
      --card: #1a211c;
      --ink: #e8eee9;
      --muted: #a3b0a8;
      --line: #2c3730;
      --accent: #6fbf8c;
      --accent-ink: #0d1a12;
      --warn: #f0b47a;
      --warn-tint: #2a1f15;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 34rem; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .from { color: var(--muted); font-size: 0.9rem; margin: 0 0 4px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0; text-wrap: balance; }
  .figures { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px 0 0; }
  .figures dt { color: var(--muted); }
  .figures dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
  .total { font-size: 1.35rem; }
  .lines { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .lines li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lines .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lines .works { white-space: pre-line; }
  .lines .detail { grid-column: 2; color: var(--muted); font-size: 0.9rem; }
  .lines .price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .lines-note { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-weight: 600; }
  input[type=text], textarea {
    font: inherit; color: inherit; background: var(--ground);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
  .agree input { margin-top: 4px; width: 20px; height: 20px; flex: none; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 14px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
  }
  button.accept { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .problem { color: var(--warn); background: var(--warn-tint); border-radius: 10px; padding: 10px 12px; margin: 0; }
  .footer { text-align: center; color: var(--muted); font-size: 0.8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section class="card" id="loading"><p class="note">Opening your quote…</p></section>

  <section class="card" id="quote" hidden>
    <p class="from" id="company"></p>
    <h1 id="heading"></h1>
    <ol class="lines" id="lines" hidden></ol>
    <p class="lines-note" id="lines-note" hidden>Priced as a whole; the total below covers everything listed.</p>
    <dl class="figures">
      <dt>Total</dt><dd class="total" id="total"></dd>
      <dt>Valid until</dt><dd id="valid"></dd>
    </dl>
  </section>

  <section class="card" id="answer" hidden>
    <form id="form" novalidate>
      <label>Your name
        <input type="text" id="name" autocomplete="name" maxlength="120" required>
      </label>
      <label class="agree"><input type="checkbox" id="agree">
        <span>I've read the quote and its terms, and I'm the person who can say yes to it.</span>
      </label>
      <label id="reason-box" hidden>Anything you'd like to tell them? (optional)
        <textarea id="reason" maxlength="1000"></textarea>
      </label>
      <p class="problem" id="problem" hidden></p>
      <div class="choices">
        <button type="button" class="accept" id="accept">Accept quote</button>
        <button type="button" id="decline">Decline</button>
      </div>
      <p class="note">Your name and your answer are sent to <span class="company-name"></span>, with the time.</p>
    </form>
  </section>

  <section class="card" id="message" hidden>
    <h1 id="message-heading"></h1>
    <p id="message-text"></p>
    <p class="note" id="change-note" hidden></p>
    <button type="button" id="change" hidden></button>
  </section>

  <p class="footer">Sent with Arborations</p>
</main>

<script>
  // The licence server's public functions (db/licensing/0003_quote_offers.sql, 0004, 0005).
  // The key is the same publishable key every TIMBR app carries; it can only
  // call these functions and holds nothing else.
  const SERVER = "https://oqrfipoixhujihgakiji.supabase.co";
  const KEY = "sb_publishable_CXhm6PHM6nfTuE4hBJan1Q_mGCobfpW";

  const token = new URLSearchParams(location.search).get("q") || "";
  const $ = id => document.getElementById(id);
  let offer = null;
  let declining = false;
  // Set while the client is changing an earlier answer: the only answer the
  // form then offers is the other one.
  let changingTo = null;

  async function call(fn, body) {
    const response = await fetch(`${SERVER}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": `Bearer ${KEY}` },
      body: JSON.stringify(body)
    });
    if (!response.ok) throw new Error(`The server answered ${response.status}`);
    return response.json();
  }

  function show(id) {
    for (const section of ["loading", "quote", "answer", "message"]) $(section).hidden = !id.includes(section);
  }

  function say(heading, text, withQuote) {
    $("message-heading").textContent = heading;
    $("message-text").textContent = text;
    $("change-note").hidden = true;
    $("change").hidden = true;
    show(withQuote ? ["quote", "message"] : ["message"]);
  }

  function when(instant) {
    return new Date(instant).toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }

  // The decision, and — while the company's window is open — one button to
  // change it. After the window: the decision and who to call.
  function decided() {
    const accepted = offer.decision === "accepted";
    const who = offer.decided_name ? ` by ${offer.decided_name}` : "";
    const heading = accepted ? "This quote has been accepted" : "This quote has been declined";
    const text = `${accepted ? "Accepted" : "Declined"}${who} on ${when(offer.decided_at)}` +
                 (offer.changed ? " (changed from an earlier answer)." : ".") +
                 ` ${company()} has been told.`;
    say(heading, text, true);
    if (offer.can_change) {
      $("change-note").textContent = `Changed your mind? You can ${accepted ? "decline" : "accept"} this quote instead until ${when(offer.change_until_utc)}. After that, please contact ${company()}.`;
      $("change-note").hidden = false;
      $("change").textContent = accepted ? "Decline this quote instead" : "Accept this quote instead";
      $("change").hidden = false;
    } else {
      $("message-text").textContent += ` If something has changed, please contact ${company()}.`;
    }
  }

  function company() { return (offer && offer.company) || "the company"; }

  function validUntil(instant) {
    return new Date(instant).toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" });
  }

  // The quote's lines, as its PDF prints them. Built with text nodes only:
  // the words came from the company, but nothing from the server is markup.
  function lines() {
    const list = Array.isArray(offer.lines) ? offer.lines : [];
    const ol = $("lines");
    ol.textContent = "";
    for (const line of list) {
      const li = document.createElement("li");
      const n = document.createElement("span"); n.className = "n"; n.textContent = `${line.n || ""}`;
      const works = document.createElement("span"); works.className = "works"; works.textContent = line.works || "";
      const price = document.createElement("span"); price.className = "price"; price.textContent = line.price || "";
      li.append(n, works, price);
      if (line.detail) { const d = document.createElement("span"); d.className = "detail"; d.textContent = line.detail; li.append(d); }
      ol.append(li);
    }
    ol.hidden = list.length === 0;
    $("lines-note").hidden = list.length === 0 || list.some(line => line.price);
  }

  function fill() {
    $("company").textContent = offer.company || "";
    $("heading").textContent = `Quote #${offer.reference}${offer.version > 1 ? ` (version ${offer.version})` : ""}`;
    lines();
    $("total").textContent = offer.total;
    $("valid").textContent = validUntil(offer.valid_until_utc);
    for (const element of document.querySelectorAll(".company-name")) element.textContent = company();
    document.title = `Quote #${offer.reference}`;
  }

  function explain(state, decision) {
    if (state === "decided") {
      decided();
    } else if (state === "withdrawn") {
      say("This quote has been replaced",
          `${company()} has sent a newer version. Please use the link in their latest email.`, true);
    } else if (state === "expired") {
      say("This quote has expired",
          `It was valid until ${validUntil(offer.valid_until_utc)}. Please contact ${company()} for an updated quote.`, true);
    } else {
      say("This link doesn't open a quote",
          "Please check you've used the whole link from your email, or contact the company that sent it.", false);
    }
  }

  async function open() {
    if (token.length < 20) return explain("unknown");
    try {
      offer = await call("quote_offer", { p_token: token });
    } catch {
      return say("Your quote couldn't be opened just now", "Please check your connection and try the link again in a moment.", false);
    }
    if (!offer || offer.state === "unknown") return explain("unknown");
    fill();
    if (offer.state !== "open") return explain(offer.state, offer.decision);
    show(["quote", "answer"]);
  }

  function problem(text) {
    $("problem").textContent = text;
    $("problem").hidden = !text;
  }

  async function answer(decision) {
    const name = $("name").value.trim();
    if (!name) return problem("Please put in your name.");
    if (decision === "accepted" && !$("agree").checked) return problem("Please tick the box to say you've read the quote and can accept it.");
    problem("");
    $("accept").disabled = $("decline").disabled = true;
    try {
      const result = await call("respond_to_quote", {
        p_token: token, p_decision: decision, p_name: name, p_reason: decision === "declined" ? $("reason").value.trim() : ""
      });
      if (result && result.ok) {
        // Read it back, so the page shows the decision as recorded and the
        // window the company allows for changing it.
        try { offer = await call("quote_offer", { p_token: token }); } catch { offer = { ...offer, state: "decided", decision, decided_name: name, decided_at: new Date().toISOString(), can_change: false }; }
        changingTo = null;
        decided();
        $("message-heading").textContent = result.changed
          ? (decision === "accepted" ? "Your answer is now: accepted" : "Your answer is now: declined")
          : (decision === "accepted" ? "Thank you, your quote is accepted" : "Thank you for letting us know");
        return;
      }
      if (result && result.reason === "name_needed") return problem("Please put in your name.");
      if (result && result.state) return explain(result.state, result.decision);
      problem("Your answer couldn't be sent. Please try again.");
    } catch {
      problem("Your answer couldn't be sent just now. Please check your connection and try again.");
    } finally {
      $("accept").disabled = $("decline").disabled = false;
    }
  }

  $("accept").addEventListener("click", () => answer("accepted"));
  $("change").addEventListener("click", () => {
    // The form again, offering only the other answer, with the name they gave.
    changingTo = offer.decision === "accepted" ? "declined" : "accepted";
    $("name").value = offer.decided_name || "";
    $("agree").checked = false;
    $("accept").hidden = changingTo !== "accepted";
    $("decline").hidden = changingTo !== "declined";
    if (changingTo === "declined") { declining = true; $("reason-box").hidden = false; $("decline").textContent = "Send decline"; }
    show(["quote", "answer"]);
    $("name").focus();
  });
  $("decline").addEventListener("click", () => {
    if (!declining) {
      // First press shows the reason box; the second sends the decline.
      declining = true;
      $("reason-box").hidden = false;
      $("decline").textContent = "Send decline";
      $("reason").focus();
      return;
    }
    answer("declined");
  });
  $("form").addEventListener("submit", event => event.preventDefault());

  open();
</script>
</body>
</html>
