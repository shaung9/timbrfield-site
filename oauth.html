<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Back to Arborations</title>
<style>
  body { margin: 0; padding: 48px 20px; background: #f5f6f3; color: #17221b; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; background: #fff; border: 1px solid #dfe4df; border-radius: 14px; padding: 22px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: #5f6b64; font-size: 0.9rem; }
  a { color: #2f6b46; }
</style>
</head>
<body>
<main>
  <h1 id="heading">Taking you back to Arborations…</h1>
  <p id="text" class="muted">If nothing happens, Arborations isn't waiting for this sign-in any more. Close this window and press Sign in again in Arborations on your computer.</p>
  <p id="link"></p>
</main>
<script>
  // A sign-in's one stop between the system and the Hub on the person's own
  // computer. The system returns here (it insists on an https address); this
  // page forwards the code and state to the port the Hub named in the state,
  // on 127.0.0.1, and nothing else. There is nothing to keep and no secret
  // here: the code is useless without the secret and verifier the Hub holds.
  const params = new URLSearchParams(location.search);
  const state = params.get("state") || "";
  const port = Number((state.split(".")[0] || ""));
  const ok = Number.isInteger(port) && port >= 1024 && port <= 65535;
  const $ = id => document.getElementById(id);

  if (!ok) {
    $("heading").textContent = "This page only works as part of an Arborations sign-in";
    $("text").textContent = "Go back to Arborations on your computer and press Sign in there.";
  } else {
    const forward = new URLSearchParams();
    for (const name of ["code", "state", "error", "error_description"]) {
      if (params.has(name)) forward.set(name, params.get(name));
    }
    const target = `http://127.0.0.1:${port}/callback/?${forward.toString()}`;
    const a = document.createElement("a");
    a.href = target;
    a.textContent = "Continue to Arborations";
    $("link").append(a);
    location.replace(target);
  }
</script>
</body>
</html>
